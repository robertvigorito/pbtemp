site_name: pbtemp
site_description: Python project scaffold generator
site_dir: dist/docs

nav:
  - Home: index.md
  - API Reference: api.md

theme:
  name: windmill-dark

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: true
