[project]
name = "my_project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
]
# Package script entry point
true = "my_project.main:main"

# Build system configuration
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Dependency groups for development and testing
[dependency-groups]
dev = [
    "black>=25.11.0",
    "isort[colors]>=7.0.0",
    "pylint>=4.0.4",
    "pytest>=9.0.1",
    "pytest-coverage>=0.0",
    "ruff>=0.14.8",
]

# Pytest Setup
[tool.pytest.ini_options]
addopts = "-s -rap"
testpaths = ["tests"]

# Black Setup
[tool.black]
line-length = 120

# Pylint Setup
[tool.pylint]
max-line-length = 120
disable = ["too-few-public-methods"]

# Isort Setup
[tool.isort]
line_length = 120
profile = "black"

# MyPy Setup
[tool.mypy]
follow_imports = "normal"
