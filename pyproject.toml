[project]
name = "pbtemp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rvigorito", email = "rvigorito@d2.com" }
]
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "questionary>=2.1.1",
    "tomlkit>=0.13.3",
    "typer>=0.27.1",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.11.0"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
pbtemp = "pbtemp:main"

[build-system]
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend.data]
purelib = "resources"
