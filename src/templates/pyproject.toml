[project]
name = "{{ project_name | default('my_project') }}"
version = "{{ version | default('0.1.0') }}"
description = "{{ description | default('Add your description here') }}"
readme = "README.md"
license = "{{ license | default('MIT') }}"
requires-python = "{{ requires_python | default('>=3.12') }}"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3.16",
]
{% if use_insert_bin_command | default(true) %}
# Package script entry point
{{ use_insert_bin_command | default('my_project') }} = "{{ project_name }}.main:main"
{% endif %}
# Build system configuration
[build-system]
{%- if build_backend | default('hatchling') == 'uv_build' %}
requires = ["uv_build>=0.9.11,<0.10.0"]
build-backend = "uv_build"
{%- elif build_backend == 'setuptools' %}
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
{%- elif build_backend == 'hatchling' %}
requires = ["hatchling"]
build-backend = "hatchling.build"
{%- elif build_backend == 'poetry' %}
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
{%- elif build_backend == 'flit' %}
requires = ["flit-core>=3.9"]
build-backend = "flit_core.buildapi"
{%- elif build_backend == 'pdm' %}
requires = ["pdm-backend"]
build-backend = "pdm.backend"
{%- endif %}

# Dependency groups for development and testing
[dependency-groups]
dev = [
{%- if use_black | default(true) %}
    "black>=25.11.0",
{%- endif %}
{%- if use_isort | default(true) %}
    "isort[colors]>=7.0.0",
{%- endif %}
{%- if use_pylint | default(true) %}
    "pylint>=4.0.4",
{%- endif %}
{%- if use_pytest | default(true) %}
    "pytest>=9.0.1",
    "pytest-coverage>=0.0",
{%- endif %}
    "ruff>=0.14.8",
]

{%- if use_pytest | default(true) %}
# Pytest Setup
[tool.pytest.ini_options]
addopts = "-s -rap"
testpaths = ["tests"]
{%- endif %}
{%- if use_black | default(true) %}

# Black Setup
[tool.black]
line-length = {{ line_length | default(120) }}
{%- endif %}
{%- if use_pylint | default(true) %}

# Pylint Setup
[tool.pylint]
max-line-length = {{ line_length | default(120) }}
{%- endif %}
{%- if use_isort | default(true) %}
disable = ["too-few-public-methods"]

# Isort Setup
[tool.isort]
line_length = {{ line_length | default(120) }}
profile = "black"
{%- endif %}
{%- if use_mypy | default(true) %}

# MyPy Setup
[tool.mypy]
follow_imports = "normal"
{%- endif %}
